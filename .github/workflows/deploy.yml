
name: Deploy to Bluehost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Bluehost
        uses: appleboy/ssh-action@v1.2.0

        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

        with:
          host: ${{ secrets.BLUEHOST_HOST }}
          username: ${{ secrets.BLUEHOST_USER }}
          port: ${{ secrets.BLUEHOST_PORT }}
          key: ${{ secrets.BLUEHOST_SSH_KEY }}

          envs: VITE_GOOGLE_CLIENT_ID

          script: |
            set -e

            cd /var/www/vyapar-bharat

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing frontend dependencies..."
            cd frontend
            npm ci

            echo "Configuring Google Client ID..."
            printf 'VITE_GOOGLE_CLIENT_ID=%s\n' "$VITE_GOOGLE_CLIENT_ID" > .env.production

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            cd ../backend
            npm ci

            echo "Deployment completed successfully!"
